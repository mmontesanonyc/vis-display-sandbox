<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SARS-CoV-2 variants by week</title>
<style>
:root{--bg:#fff;--fg:#1f1b2e;--muted:#6b6780;--line:#e4e1ee;--blank:#f3f2f7}
@media (prefers-color-scheme:dark){:root{--bg:#15131d;--fg:#ece9f6;--muted:#9a95b0;--line:#2e2a3f;--blank:#221f30}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px}
h1{font-size:1.25rem;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 16px;font-size:.9rem}
#msg{color:var(--muted);padding:12px 0}
.wrap{overflow-x:auto}
table.dataTable{border-collapse:collapse;width:100%;font-size:.85rem}
table.dataTable th,table.dataTable td{border:2px solid var(--bg);padding:8px 10px;text-align:center;white-space:nowrap}
@media (max-width:640px){
  table.dataTable thead th:first-child,table.dataTable tbody td:first-child{position:sticky;left:0;z-index:2}
  table.dataTable thead th:first-child{z-index:3}
}
table.dataTable thead th{cursor:pointer;color:var(--fg);font-weight:600;border-bottom:1px solid var(--line);position:relative;padding-right:18px}
table.dataTable thead th:first-child{cursor:default}
table.dataTable thead th:first-child::after{content:none}
table.dataTable thead th:first-child,table.dataTable tbody td:first-child{text-align:left;font-weight:600;background:var(--bg);color:var(--fg)}
table.dataTable thead th::after{content:"↕";position:absolute;right:5px;opacity:.3;font-size:.75rem}
table.dataTable thead th.sorting_asc::after{content:"▲";opacity:.9}
table.dataTable thead th.sorting_desc::after{content:"▼";opacity:.9}
.dataTables_filter{display:flex;justify-content:flex-end;margin-top:12px}
.dataTables_filter label{font-size:.85rem;color:var(--muted)}
.dataTables_filter input{margin-left:8px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.legend{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:.8rem;color:var(--muted)}
.bar{height:10px;width:200px;border-radius:5px;background:linear-gradient(90deg,#fcfbfd,#dadaeb,#9e9ac8,#6a51a3,#3f007d);border:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <h1>SARS-CoV-2 variants</h1>
  <p class="sub">Weekly share of sequences</p>
  <div id="msg">Loading data…</div>
  <div class="wrap"><table id="t" class="display"></table></div>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/datatables.net@1.13.11/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
const CSV_URL="https://gist.githubusercontent.com/mmontesanonyc/0d3d9997a2f0d67243ed24c02103153b/raw/200bcf50961599ba7d93c315150373d2b2637a93/wastewaterData.csv";

const ramp=["#ffffff","#F8F1FC","#EDE0F5","#DEC4EF","#BC6AE8","#A020C8","#8739B7","#520583","#1F003D"].map(h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)));
let MAX=1;
function color(v){
  const t=Math.sqrt(v/MAX)*(ramp.length-1), i=Math.min(Math.floor(t),ramp.length-2), f=t-i;
  const c=ramp[i].map((a,k)=>Math.round(a+(ramp[i+1][k]-a)*f));
  const lum=0.299*c[0]+0.587*c[1]+0.114*c[2];
  return {bg:`rgb(${c})`,fg:lum<140?"#fff":"#1f1b2e"};
}

// Accepts M/D/YYYY, M/D/YY, YYYY-MM-DD (optionally with a time), or anything Date can parse.
// Returns a UTC timestamp, or NaN.
function parseDate(s){
  s=String(s||"").trim().replace(/^"|"$/g,"");
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){let y=+m[3]; if(y<100)y+=2000; return Date.UTC(y,+m[1]-1,+m[2]);}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return Date.UTC(+m[1],+m[2]-1,+m[3]);
  const t=Date.parse(s);
  if(isNaN(t)) return NaN;
  const d=new Date(t); return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
}
const label=ts=>{const d=new Date(ts);return `${d.getUTCMonth()+1}/${d.getUTCDate()}/${String(d.getUTCFullYear()).slice(-2)}`;};
const norm=h=>String(h).replace(/^\uFEFF/,"").trim().toLowerCase();
const fail=msg=>{const m=document.getElementById("msg"); if(m) m.textContent=msg; else console.error(msg);};

function build(text){
  const parsed=Papa.parse(text.replace(/^\uFEFF/,"").trim(),{header:true,skipEmptyLines:true,transformHeader:norm});
  const fields=parsed.meta.fields||[];
  for(const need of ["date","metric","submetric","value"]){
    if(!fields.includes(need)) throw new Error(`Expected a "${need}" column. Found: ${fields.join(", ")||"(none)"}`);
  }
  const recs=[];
  parsed.data.forEach(r=>{
    if(String(r.metric||"").trim()!=="SARS-CoV-2 variants") return;
    const sub=String(r.submetric||"").trim();
    if(!sub||sub==="No data this week") return;
    const ts=parseDate(r.date); if(isNaN(ts)) return;
    const v=parseFloat(r.value);
    recs.push({ts,sub,v:isNaN(v)?null:v});
  });
  if(!recs.length){
    const metrics=[...new Set(parsed.data.map(r=>String(r.metric||"").trim()))].slice(0,10).join(" | ");
    throw new Error(`No usable "SARS-CoV-2 variants" rows. Metrics seen: ${metrics}`);
  }
  const dates=[...new Set(recs.map(r=>r.ts))].sort((a,b)=>a-b);
  const variants=[...new Set(recs.map(r=>r.sub))];
  const lookup={}; recs.forEach(r=>{lookup[r.sub+"|"+r.ts]=r.v;});
  const rows=variants.map(name=>[name,...dates.map(d=>{const v=lookup[name+"|"+d];return v===undefined?null:v;})]);

  MAX=Math.max(...rows.flatMap(r=>r.slice(1).filter(v=>v!==null)));
  const maxEl=document.getElementById("max"); if(maxEl) maxEl.textContent=MAX.toFixed(0)+"%";
  const msgEl=document.getElementById("msg"); if(msgEl) msgEl.remove();

  $("#t").DataTable({
    data:rows, paging:false, info:false, dom:"t<'bottom'f>",
    orderFixed:{pre:[[0,"asc"]]},
    order:[[dates.length,"desc"]], // most recent column, highest first
    language:{search:"Search:",searchPlaceholder:"Filter variants…"},
    columns:[{title:"Variant",orderable:false,render:(v,type)=>type==="sort"?(v==="Other"?1:0):v},...dates.map(d=>({title:label(d),orderSequence:["desc","asc"],
      render:(v,type)=>type==="display"?(v===null?"–":v.toFixed(1)+"%"):(v===null?-1:v),
      createdCell:(td,v)=>{
        if(v===null){td.style.background="var(--blank)";td.style.color="var(--muted)";}
        else{const c=color(v);td.style.background=c.bg;td.style.color=c.fg;}
      }}))]
  });
}

fetch(CSV_URL).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text();})
  .then(build).catch(err=>fail("Couldn't build table: "+err.message));
</script>
</body>
</html>
